# Free-tier "cron": Render's free web services have no cron jobs or background
# workers and sleep after 15 minutes without traffic. This workflow calls the
# app on a schedule: the request wakes it up, queues the due reminders and
# drains the queue (see app/Http/Controllers/CronController.php).
#
# Required repository secrets: APP_URL (e.g. https://xyz.onrender.com) and
# CRON_SECRET (same value as the Render env var). Without them it is a no-op.

name: reminders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger POST /cron/run
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET not configured, skipping."
            exit 0
          fi

          # A sleeping free instance can take about a minute to boot.
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "$APP_URL/cron/run"
