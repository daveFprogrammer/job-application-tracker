# Render Blueprint: https://render.com/docs/blueprint-spec
#
# One free Docker web service. The PostgreSQL database lives on Neon (free tier),
# so its connection string is set by hand (DB_URL), like the other secrets.
services:
    - type: web
      name: job-application-tracker
      runtime: docker
      plan: free
      region: frankfurt
      dockerfilePath: ./Dockerfile
      healthCheckPath: /up
      autoDeploy: true
      envVars:
          - key: APP_NAME
            value: Job Application Tracker
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            sync: false # php artisan key:generate --show
          - key: APP_URL
            sync: false # https://<service>.onrender.com
          - key: APP_TIMEZONE
            value: Europe/Rome
          - key: LOG_CHANNEL
            value: stderr
          - key: LOG_LEVEL
            value: info

          - key: DB_CONNECTION
            value: pgsql
          - key: DB_URL
            sync: false # Neon pooled connection string, with ?sslmode=require

          - key: SESSION_DRIVER
            value: database
          - key: SESSION_SECURE_COOKIE
            value: 'true'
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: database

          - key: MAIL_MAILER
            value: smtp
          - key: MAIL_HOST
            sync: false # e.g. smtp-relay.brevo.com
          - key: MAIL_PORT
            value: '587'
          - key: MAIL_USERNAME
            sync: false
          - key: MAIL_PASSWORD
            sync: false
          - key: MAIL_FROM_ADDRESS
            sync: false
          - key: MAIL_FROM_NAME
            value: Job Application Tracker

          # Shared with the GitHub Actions workflow that triggers POST /cron/run.
          - key: CRON_SECRET
            generateValue: true
